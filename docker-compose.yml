services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    command: npx tsx apps/server/src/index.ts
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      RUN_WORKER: "false"
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: npx tsx apps/server/src/worker.ts
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      RUN_WORKER: "true"
    depends_on:
      redis:
        condition: service_healthy
